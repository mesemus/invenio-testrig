name: 'Resolve Pull Requests'
description: 'Resolve GitHub PR URLs in config to git+branch format'
inputs:
  config_file:
    description: 'Path to config.json5 file'
    required: false
    default: 'config.json5'
runs:
  using: 'composite'
  steps:
    - name: Resolve pull requests in config
      shell: bash
      run: |
        if [ -z "$TOOLS_PYTHON" ]; then
          echo "Error: TOOLS_PYTHON environment variable is not set"
          exit 1
        fi
        
        CONFIG_FILE="${{ inputs.config_file }}"
        RESOLVED_CONFIG="config-resolved.json"
        echo "Resolving pull requests in: $CONFIG_FILE"
        echo "Output will be written to: $RESOLVED_CONFIG"
        
        # Run the script to resolve PR URLs (creates config-resolved.json)
        $TOOLS_PYTHON scripts/resolve_pull_requests.py "$CONFIG_FILE" "$RESOLVED_CONFIG"
        
        echo "✓ Pull requests resolved successfully to $RESOLVED_CONFIG"
