name: 'Prepare Config'
description: 'Resolve pull requests and load test configuration'
inputs:
  config_file:
    description: 'Path to config.json5 file'
    required: false
    default: 'config.json5'
  config_resolved:
    description: 'Path to resolved config file'
    required: false
    default: 'config-resolved.json'
outputs:
  test_name:
    description: 'Name of the test run'
    value: ${{ steps.load.outputs.test_name }}
  test_timeout:
    description: 'Timeout in minutes for each test run'
    value: ${{ steps.load.outputs.test_timeout }}
  packages:
    description: 'Space-separated list of packages to test (empty for all)'
    value: ${{ steps.load.outputs.packages }}
runs:
  using: 'composite'
  steps:
    - name: Prepare configuration
      id: load
      shell: bash
      run: |
        if [ -z "$TOOLS_PYTHON" ]; then
          echo "Error: TOOLS_PYTHON environment variable is not set"
          exit 1
        fi
        
        CONFIG_FILE="${{ inputs.config_file }}"
        RESOLVED_CONFIG="${{ inputs.config_resolved }}"
        
        # Run the script to resolve PRs and load config (outputs to GITHUB_OUTPUT)
        $TOOLS_PYTHON scripts/prepare_config.py "$CONFIG_FILE" "$RESOLVED_CONFIG" >> $GITHUB_OUTPUT
