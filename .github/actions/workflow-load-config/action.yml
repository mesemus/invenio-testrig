name: 'Workflow Load Config'
description: 'Load and resolve test configuration with all necessary setup'
inputs:
  config_file:
    description: 'Path to config file (JSON5 format)'
    required: true
  python_version:
    description: 'Python version to use'
    required: true
  config_resolved:
    description: 'Path to resolved config file'
    required: true
outputs:
  test_name:
    description: 'Name of the test run'
    value: ${{ steps.load.outputs.test_name }}
  test_timeout:
    description: 'Timeout in minutes for each test run'
    value: ${{ steps.load.outputs.test_timeout }}
  packages:
    description: 'Space-separated list of packages to test (empty for all)'
    value: ${{ steps.load.outputs.packages }}
  initial_commit:
    description: 'Initial commit SHA'
    value: ${{ steps.capture_commit.outputs.initial_commit }}
runs:
  using: 'composite'
  steps:
    - name: Capture initial commit
      id: capture_commit
      shell: bash
      run: |
        INITIAL_COMMIT=$(git rev-parse HEAD)
        echo "initial_commit=$INITIAL_COMMIT" >> $GITHUB_OUTPUT
        echo "Initial commit: $INITIAL_COMMIT"

    - name: Setup Python and UV
      uses: ./.github/actions/action-install-python
      with:
        python-version: ${{ inputs.python_version }}

    - name: Prepare configuration
      id: load
      uses: ./.github/actions/action-prepare-config
      with:
        config_file: ${{ inputs.config_file }}
        config_resolved: ${{ inputs.config_resolved }}

    - name: Upload resolved config
      uses: actions/upload-artifact@v4
      with:
        name: resolved-config
        path: config-resolved.json
        retention-days: 1
