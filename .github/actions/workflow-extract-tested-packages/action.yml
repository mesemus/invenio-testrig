name: 'Workflow Extract Tested Packages'
description: 'Extract Invenio packages to test from zenodo-rdm uv.lock'
inputs:
  python_version:
    description: 'Python version to use'
    required: true
  config_resolved:
    description: 'Path to resolved config file'
    required: true
  filter_packages:
    description: 'Space-separated list of packages to filter'
    required: false
outputs:
  packages:
    description: 'JSON array of packages to test'
    value: ${{ steps.extract.outputs.packages }}
runs:
  using: 'composite'
  steps:
    - name: Download modified config
      uses: actions/download-artifact@v4
      with:
        name: resolved-config
        path: .

    - name: Setup Python and UV
      uses: ./.github/actions/action-install-python
      with:
        python-version: ${{ inputs.python_version }}

    - name: Clone Zenodo RDM repository
      shell: bash
      run: |
        echo "::group::Cloning zenodo-rdm repository"
        git clone --depth 1 https://github.com/zenodo/zenodo-rdm.git
        echo "::endgroup::"
        echo "✓ zenodo-rdm repository cloned"

    - name: Extract Invenio packages from uv.lock
      id: extract
      shell: bash
      run: |
        # Build options array
        opts=()

        # Add package filter if provided
        if [ -n "${{ inputs.filter_packages }}" ]; then
          echo "Filtering packages: ${{ inputs.filter_packages }}"
          opts+=("--filter-packages" ${{ inputs.filter_packages }})
        fi

        $TOOLS_PYTHON scripts/extract_packages_to_test.py zenodo-rdm/uv.lock "${{ inputs.config_resolved }}" packages.sh ${opts[@]}

        # Source the output variables
        source packages.sh

        # packages is already a JSON array
        echo "Found packages: $packages"
        echo "packages=$packages" >> $GITHUB_OUTPUT
