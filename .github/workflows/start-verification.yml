name: 1. Create Verification

on:
    workflow_dispatch:
        inputs:
            patches:
                description: "Patches separated by space in form of repo/package@branch or org/repo#pr. Use inveniosoftware/pytest-invenio@master to test all packages."
                required: true
                type: string
            branch_name:
                description: "Branch name for this verification"
                required: true
                type: string
            python_version:
                description: "Python version to use"
                required: false
                type: string
                default: "3.14"
            check_formatting:
                description: "Check black/isort during tests"
                required: false
                type: boolean
                default: true
            verbose_pytest:
                description: "Run pytest with verbose output (-vv -s)"
                required: false
                type: boolean
                default: false

jobs:
    setup_branch:
        name: Setup Branch with Custom Patches
        runs-on: ubuntu-latest
        permissions:
            contents: write
            actions: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install pyyaml
              run: |
                  pip install pyyaml

            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Create new branch
              env:
                  BRANCH_NAME: ${{ inputs.branch_name }}
              run: |
                  git checkout -b "${BRANCH_NAME}"

            - name: Update patches in config.yaml
              env:
                  PATCHES_INPUT: ${{ inputs.patches }}
              run: |
                  python3 << 'PYTHON_SCRIPT'
                  import os
                  import yaml
                  import re

                  # Get the patches input
                  patches_input = os.getenv('PATCHES_INPUT', '').strip()

                  if not patches_input:
                      print("Error: No patches provided")
                      exit(1)

                  patches = [x.strip() for x in patches_input.split()]
                  patches = [x for x in patches if x]

                  print(f"Updating config.yaml with {len(patches)} patch(es):")
                  patches_dict = {}
                  for patch in patches:
                      # split on / or @ or #
                      patch_parts = re.split(r'[/@#]', patch)
                      if len(patch_parts) != 3:
                          print(f"  Invalid patch format: {patch}. Expected format: repo/package@branch or org/repo#pr")
                          exit(1)
                      patches_dict[patch_parts[1]] = patch

                      # Load existing config
                  with open('config.yaml', 'r') as f:
                      config = yaml.safe_load(f)

                  # Update patches in the config
                  config['patches'] = patches_dict

                  # Save updated config (without comments)
                  with open('config.yaml', 'w') as f:
                      yaml.dump(config, f, default_flow_style=False, sort_keys=True)

                  print("\nUpdated config.yaml successfully")
                  PYTHON_SCRIPT

            - name: Display updated config.yaml
              run: |
                  echo "Updated config.yaml content:"
                  cat config.yaml

            - name: Commit changes
              env:
                  BRANCH_NAME: ${{ inputs.branch_name }}
              run: |
                  git add config.yaml
                  git commit -m "Update patches for verification on branch ${BRANCH_NAME}"

            - name: Push new branch
              env:
                  BRANCH_NAME: ${{ inputs.branch_name }}
              run: |
                  git push origin "${BRANCH_NAME}"

            - name: Trigger verify-patches workflow
              id: trigger
              env:
                  GH_TOKEN: ${{ github.token }}
                  BRANCH_NAME: ${{ inputs.branch_name }}
                  PYTHON_VERSION: ${{ inputs.python_version }}
                  VERBOSE_PYTEST: ${{ inputs.verbose_pytest }}
                  CHECK_FORMATTING: ${{ inputs.check_formatting }}
              run: |
                  # Trigger the workflow
                  gh workflow run verify-patches.yml \
                    --ref "${BRANCH_NAME}" \
                    --field python_version="${PYTHON_VERSION}" \
                    --field verbose_pytest="${VERBOSE_PYTEST}" \
                    --field check_formatting="${CHECK_FORMATTING}"

                  # Wait a moment for the workflow to start
                  sleep 5

                  # Get the most recent workflow run for verify-patches on this branch
                  RUN_ID=$(gh run list \
                    --workflow=verify-patches.yml \
                    --branch="${BRANCH_NAME}" \
                    --limit=1 \
                    --json databaseId \
                    --jq '.[0].databaseId')

                  if [ -n "$RUN_ID" ]; then
                    RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID}"
                    echo "run_url=${RUN_URL}" >> $GITHUB_OUTPUT
                    echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
                  else
                    echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/workflows/verify-patches.yml" >> $GITHUB_OUTPUT
                    echo "run_id=" >> $GITHUB_OUTPUT
                  fi

            - name: Create workflow summary
              if: always()
              env:
                  RUN_URL: ${{ steps.trigger.outputs.run_url }}
                  RUN_ID: ${{ steps.trigger.outputs.run_id }}
                  BRANCH_NAME: ${{ inputs.branch_name }}
                  PATCHES_INPUT: ${{ inputs.patches }}
              run: |
                  cat >> $GITHUB_STEP_SUMMARY << EOF
                  # ✅ Verification Started

                  Successfully created branch **\`${BRANCH_NAME}\`** with custom patches and triggered verification workflow.

                  ## 📦 Patches Applied

                  \`\`\`yaml
                  ${PATCHES_INPUT}
                  \`\`\`

                  ## 🔗 View Verification Progress

                  EOF

                  if [ -n "$RUN_ID" ]; then
                    cat >> $GITHUB_STEP_SUMMARY << EOF
                  **[Click here to view the verification workflow →]($RUN_URL)**

                  - **Workflow Run ID:** \`$RUN_ID\`
                  - **Branch:** \`${BRANCH_NAME}\`
                  - **Status:** Running
                  EOF
                  else
                    cat >> $GITHUB_STEP_SUMMARY << EOF
                  **[Click here to view workflow runs →]($RUN_URL)**

                  - **Branch:** \`${BRANCH_NAME}\`

                  > Note: The workflow run may take a few moments to appear in the list.
                  EOF
                  fi
