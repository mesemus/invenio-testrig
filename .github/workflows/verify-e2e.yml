name: 3. Run E2E UI and API Tests

on:
    workflow_dispatch:
        inputs:
            python_version:
                description: "Python version to use"
                required: false
                type: string
                default: "3.14"
            node_version:
                description: "Node.js version to use"
                required: false
                type: string
                default: "21"

env:
    PYTHONUNBUFFERED: 1
    PYTHON_VERSION: ${{ inputs.python_version || '3.14' }}
    PYTHON: python${{ inputs.python_version || '3.14' }}
    CONFIG_RESOLVED: ${{ github.workspace }}/config-resolved.json
    NODE_VERSION: ${{ inputs.node_version || '21' }}

jobs:
    load_config:
        name: Load Test Configuration
        runs-on: ubuntu-latest
        outputs:
            test_name: ${{ steps.load_config.outputs.test_name }}
            test_timeout: ${{ steps.load_config.outputs.test_timeout }}
            initial_commit: ${{ steps.load_config.outputs.initial_commit }}
            e2e_git_url: ${{ steps.extract_e2e.outputs.e2e_git_url }}
            e2e_git_branch: ${{ steps.extract_e2e.outputs.e2e_git_branch }}
            repository_git_url: ${{ steps.extract_e2e.outputs.repository_git_url }}
            repository_git_branch: ${{ steps.extract_e2e.outputs.repository_git_branch }}
        steps:
            - name: Checkout verification repository
              uses: actions/checkout@v4

            - name: Load configuration
              id: load_config
              uses: ./.github/actions/workflow-load-config
              with:
                  config_file: config.yaml
                  python_version: ${{ env.PYTHON_VERSION }}
                  config_resolved: ${{ env.CONFIG_RESOLVED }}

            - name: Extract E2E repository info
              id: extract_e2e
              run: |
                  if ! [ -f "${{ env.CONFIG_RESOLVED }}" ]; then
                    echo "Error: Config file not found: ${{ env.CONFIG_RESOLVED }}"
                    exit 1
                  fi

                  # Extract e2e_repository information from config
                  E2E_GIT_URL=$(jq -r '.e2e_repository.e2e_git.git // ""' "${{ env.CONFIG_RESOLVED }}")
                  E2E_GIT_BRANCH=$(jq -r '.e2e_repository.e2e_git.branch // ""' "${{ env.CONFIG_RESOLVED }}")
                  REPOSITORY_GIT_URL=$(jq -r '.e2e_repository.git.git // ""' "${{ env.CONFIG_RESOLVED }}")
                  REPOSITORY_GIT_BRANCH=$(jq -r '.e2e_repository.git.branch // ""' "${{ env.CONFIG_RESOLVED }}")

                  if [ -z "$E2E_GIT_URL" ] || [ -z "$REPOSITORY_GIT_URL" ]; then
                    echo "Error: e2e_repository configuration missing or incomplete in config"
                    exit 1
                  fi

                  echo "e2e_git_url=$E2E_GIT_URL" >> $GITHUB_OUTPUT
                  echo "e2e_git_branch=$E2E_GIT_BRANCH" >> $GITHUB_OUTPUT
                  echo "repository_git_url=$REPOSITORY_GIT_URL" >> $GITHUB_OUTPUT
                  echo "repository_git_branch=$REPOSITORY_GIT_BRANCH" >> $GITHUB_OUTPUT

                  echo "E2E repository: $E2E_GIT_URL @ $E2E_GIT_BRANCH"
                  echo "Main repository: $REPOSITORY_GIT_URL @ $REPOSITORY_GIT_BRANCH"

    run_e2e_tests:
        name: Run E2E Tests
        needs: load_config
        runs-on: ubuntu-latest
        permissions:
            contents: write
            actions: read
        env:
            REPOSITORY_E2E_ROOT: ${{ github.workspace }}/parent-directory

        steps:
            - name: Checkout invenio-testrig repository
              uses: actions/checkout@v4

            - name: Download modified config
              uses: actions/download-artifact@v4
              with:
                  name: resolved-config
                  path: .

            - name: Setup Python and UV
              uses: ./.github/actions/action-install-python
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "${{ env.NODE_VERSION }}"

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: latest

            - name: Create directory structure
              run: |
                  echo "Creating directory structure for E2E tests..."
                  mkdir -p "${{ env.REPOSITORY_E2E_ROOT }}"
                  cd "${{ env.REPOSITORY_E2E_ROOT }}"
                  echo "Working directory: $(pwd)"

            - name: Clone main repository
              run: |
                  cd "${{ env.REPOSITORY_E2E_ROOT }}"

                  REPO_URL="${{ needs.load_config.outputs.repository_git_url }}"
                  REPO_BRANCH="${{ needs.load_config.outputs.repository_git_branch }}"

                  echo "Cloning $REPO_URL (branch: ${REPO_BRANCH:-default})"

                  if [ -n "$REPO_BRANCH" ]; then
                    git clone --branch "$REPO_BRANCH" "$REPO_URL" repo
                  else
                    git clone "$REPO_URL" repo
                  fi

                  echo "Repository cloned to: repo"

            - name: Clone invenio-e2e repository
              run: |
                  cd "${{ env.REPOSITORY_E2E_ROOT }}"

                  E2E_URL="${{ needs.load_config.outputs.e2e_git_url }}"
                  E2E_BRANCH="${{ needs.load_config.outputs.e2e_git_branch }}"

                  echo "Cloning $E2E_URL (branch: ${E2E_BRANCH:-default})"

                  if [ -n "$E2E_BRANCH" ]; then
                    git clone --branch "$E2E_BRANCH" "$E2E_URL" invenio-e2e
                  else
                    git clone "$E2E_URL" invenio-e2e
                  fi

                  echo "invenio-e2e cloned"

            - name: Setup E2E directory structure
              run: |
                  cd "${{ env.REPOSITORY_E2E_ROOT }}"

                  # Check if e2e directory exists in the main repository
                  # and if not, copy the default example-tests
                  if [ ! -d "repo/e2e" ]; then                    
                      cp -r invenio-e2e/example-tests "repo/e2e"
                  fi

                  echo "E2E directory structure ready"

            - name: Create pnpm-workspace.yaml
              run: |
                  cd "${{ env.REPOSITORY_E2E_ROOT }}"

                  cat > pnpm-workspace.yaml << EOF
                  # pnpm-workspace.yaml
                  packages:
                    - repo/e2e
                    - invenio-e2e
                  EOF

                  echo "Created pnpm-workspace.yaml:"
                  cat pnpm-workspace.yaml

            - name: Install pnpm dependencies
              run: |
                  cd "${{ env.REPOSITORY_E2E_ROOT }}/repo/e2e"
                  pnpm install

            - name: Install Playwright browsers
              run: |
                  cd "${{ env.REPOSITORY_E2E_ROOT }}/repo/e2e"
                  npx playwright install --with-deps

            - name: Setup Invenio instance
              run: |
                  cd "${{ env.REPOSITORY_E2E_ROOT }}/repo"

                  if [ -f "run.sh" ]; then
                    # cesnet flavour
                    ./run.sh install
                  else
                    # invenio rdm standard
                    $TOOLS_BIN/invenio-cli install
                  fi

                  # setup services
                  export INVENIO_CELERY_ALWAYS_EAGER=1
                  if [ -f "run.sh" ]; then
                    ./run.sh services setup
                  else
                     $TOOLS_BIN/invenio-cli services setup
                  fi

            - name: Start Invenio server
              run: |
                  cd "${{ env.REPOSITORY_E2E_ROOT }}/repo"

                  # Start the server in the background
                  if [ -f "run.sh" ]; then
                      # cesnet flavour
                      nohup ./run.sh run > invenio-server.log 2>&1 &
                      echo $! > invenio-server.pid
                  else
                      # invenio rdm standard
                      nohup $TOOLS_BIN/invenio-cli run > invenio-server.log 2>&1 &
                      echo $! > invenio-server.pid
                  fi

                  # Wait for server to start
                  echo "Waiting for server to start..."
                  for i in {1..30}; do
                      if curl -s http://localhost:5000 > /dev/null; then
                          echo "Server started successfully"
                          break
                      fi
                      sleep 2
                  done

            - name: Run E2E tests
              id: run_tests
              continue-on-error: true
              timeout-minutes: ${{ fromJson(needs.load_config.outputs.test_timeout) }}
              run: |
                  cd "${{ env.REPOSITORY_E2E_ROOT }}/repo/e2e"

                  export INVENIO_USER_EMAIL=demo@user.org
                  export INVENIO_USER_PASSWORD=123456

                  # Run Playwright tests
                  npx playwright test --reporter=html,list

            - name: Stop Invenio server
              if: always()
              run: |
                  cd "${{ env.REPOSITORY_E2E_ROOT }}/repo"

                  if [ -f invenio-server.pid ]; then
                    kill $(cat invenio-server.pid) || true
                  fi

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-test-results
                  path: |
                      ${{ env.REPOSITORY_E2E_ROOT }}/repo/e2e/playwright-report/
                      ${{ env.REPOSITORY_E2E_ROOT }}/repo/e2e/test-results/
                      ${{ env.REPOSITORY_E2E_ROOT }}/repo/invenio-server.log
                  retention-days: 30

            - name: Check test results
              if: always()
              run: |
                  if [ "${{ steps.run_tests.outcome }}" = "failure" ]; then
                    echo "E2E tests failed"
                    exit 1
                  fi
                  echo "E2E tests passed"
