name: 2. Run Verification

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: "Path to config file (JSON5 format)"
        required: false
        default: "config.json5"
      continue_from_previous:
        description: "Continue from previous run"
        required: false
        type: boolean
        default: false
      verbose_pytest:
        description: "Run pytest with verbose output (-vv -s)"
        required: false
        type: boolean
        default: false
      verify_without_patch:
        description: "Verify without patch if the test fails"
        required: false
        type: choice
        options:
          - "as in config"
          - "true"
          - "false"
        default: "as in config"
      python_version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.14"
      no_format_check:
        description: "Skip format check"
        required: false
        type: boolean
        default: false

env:
  PYTHONUNBUFFERED: 1
  PYTHON_VERSION: ${{ inputs.python_version || '3.14' }}
  EXTRAS: "tests,opensearch2,s3,devs,s3fs,oaipmh,rdf,sparql,postgresql,admin,docs"
  CONFIG_RESOLVED: ${{ github.workspace }}/config-resolved.json

jobs:
  load_config:
    name: Load Test Configuration
    runs-on: ubuntu-latest
    outputs:
      test_name: ${{ steps.load_config.outputs.test_name }}
      run_original_tests: ${{ steps.load_config.outputs.run_original_tests }}
      test_timeout: ${{ steps.load_config.outputs.test_timeout }}
      packages: ${{ steps.load_config.outputs.packages }}
      initial_commit: ${{ steps.load_config.outputs.initial_commit }}
    steps:
      - name: Checkout verification repository
        uses: actions/checkout@v4

      - name: Load configuration
        id: load_config
        uses: ./.github/actions/workflow-load-config
        with:
          config_file: ${{ inputs.config_file }}
          verify_without_patch: ${{ inputs.verify_without_patch }}
          python_version: ${{ env.PYTHON_VERSION }}
          config_resolved: ${{ env.CONFIG_RESOLVED }}

  create_report_directory:
    name: Create Report Directory
    needs: load_config
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      report_dir: ${{ steps.create_report.outputs.report_dir }}
      report_file: ${{ steps.create_report.outputs.report_file }}
      report_timestamp: ${{ steps.create_report.outputs.report_timestamp }}

    steps:
      - name: Checkout invenio-testrig repository
        uses: actions/checkout@v4

      - name: Create report directory
        id: create_report
        uses: ./.github/actions/workflow-create-report-directory
        with:
          python_version: ${{ env.PYTHON_VERSION }}
          config_resolved: ${{ env.CONFIG_RESOLVED }}
          test_name: ${{ needs.load_config.outputs.test_name }}

  extract_tested_packages:
    name: Extract Invenio Packages
    needs: load_config
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.extract_packages.outputs.packages }}
      done_packages: ${{ steps.extract_packages.outputs.done_packages }}
      previous_report: ${{ steps.extract_packages.outputs.previous_report }}

    steps:
      - name: Checkout invenio-testrig repository
        uses: actions/checkout@v4

      - name: Extract packages
        id: extract_packages
        uses: ./.github/actions/workflow-extract-tested-packages
        with:
          python_version: ${{ env.PYTHON_VERSION }}
          config_resolved: ${{ env.CONFIG_RESOLVED }}
          continue_from_previous: ${{ inputs.continue_from_previous }}
          filter_packages: ${{ needs.load_config.outputs.packages }}

  test_packages:
    name: Test ${{ matrix.package }}
    needs:
      - load_config
      - extract_tested_packages
      - create_report_directory
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      SO_FAR_OK: 1
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.extract_tested_packages.outputs.packages) }}

    steps:
      - name: Checkout invenio-testrig repository
        uses: actions/checkout@v4

      - name: Download modified config
        uses: actions/download-artifact@v4
        with:
          name: resolved-config
          path: .

      - name: Setup Python and UV
        uses: ./.github/actions/action-install-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check if sources of ${{ matrix.package }} are patched
        # determine if there is a patch for the current package
        # outputs:
        #   has_patch (true if the current package's sources are patched)
        #   original_repository_url
        #   original_repository_branch (currently always empty as default branch is used)
        #   patched_repository_url (equal to original_repository_url if not patched, otherwise the patch URL)
        #   patched_repository_branch (equal to original_repository_branch if not patched, otherwise the patch branch)
        id: load_patches
        run: |

          # Use lookup_package.py to get repository information
          eval $($TOOLS_PYTHON scripts/lookup_package.py "${{ env.CONFIG_RESOLVED }}" ${{ matrix.package }})

          # Set outputs
          echo "original_repository_url=$original_repository_url" >> $GITHUB_OUTPUT
          echo "original_repository_branch=$original_repository_branch" >> $GITHUB_OUTPUT

          # Determine if patch exists
          if [ -n "$patched_repository_url" ]; then
            echo "has_patch=true" >> $GITHUB_OUTPUT
            echo "patched_repository_url=$patched_repository_url" >> $GITHUB_OUTPUT
            echo "patched_repository_branch=$patched_repository_branch" >> $GITHUB_OUTPUT
            echo "Found patch for ${{ matrix.package }}: $patched_repository_url @ $patched_repository_branch"
          else
            echo "has_patch=false" >> $GITHUB_OUTPUT
            echo "patched_repository_url=$original_repository_url" >> $GITHUB_OUTPUT
            echo "patched_repository_branch=$original_repository_branch" >> $GITHUB_OUTPUT
            echo "No patch configured for ${{ matrix.package }}"
          fi

      # we start by cloning the package (possibly patched) to run tests on patch at first
      - name: Clone package repository for patched (possibly) package tests
        continue-on-error: true
        uses: ./.github/actions/action-clone-package
        with:
          repository-url: ${{ steps.load_patches.outputs.patched_repository_url }}
          repository-branch: ${{ steps.load_patches.outputs.patched_repository_branch }}
          destination: package-repo

      - name: Setup virtual environment and install dependencies
        if: env.SO_FAR_OK == '1'
        continue-on-error: true
        uses: ./.github/actions/action-setup-venv
        with:
          package-path: package-repo
          extras: ${{ env.EXTRAS }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Dump original requirements
        if: env.SO_FAR_OK == '1' && ( steps.load_patches.outputs.has_patch == 'false' )
        uses: ./.github/actions/action-dump-requirements
        with:
          package-path: package-repo
          requirement-type: original

      - name: Dump requirements of original package with sources patched
        if: env.SO_FAR_OK == '1' && ( steps.load_patches.outputs.has_patch == 'true' )
        uses: ./.github/actions/action-dump-requirements
        with:
          package-path: package-repo
          requirement-type: patched

      - name: Apply patches if applicable
        id: check_patch
        continue-on-error: true
        if: env.SO_FAR_OK == '1'
        run: |

          # Use apply_patches.py to check and apply patches
          $TOOLS_PYTHON scripts/apply_patches.py ${{ matrix.package }} package-repo/.venv "${{ env.CONFIG_RESOLVED }}" patch-variables.sh

          # Source the output variables
          source patch-variables.sh

          # Set outputs
          echo "applies=$applies" >> $GITHUB_OUTPUT
          echo "patched_packages=$patched_packages" >> $GITHUB_OUTPUT

          if [ "$applies" = "true" ]; then
            echo "🔄 Patches were applied to: $patched_packages"
          else
            echo "ℹ️  No applicable patches found for this package"
            echo "reason=no-patch-packages-installed" >> $GITHUB_OUTPUT
          fi

      - name: Dump requirements for package with patched dependencies
        if: env.SO_FAR_OK == '1' && ( steps.check_patch.outputs.applies == 'true' )
        uses: ./.github/actions/action-dump-requirements
        with:
          package-path: package-repo
          requirement-type: patched-dependencies

      - name: Run tests on patched package / with patched dependencies
        id: test_with_patch
        continue-on-error: true
        if: env.SO_FAR_OK == '1' && ( steps.check_patch.outputs.applies == 'true' || steps.load_patches.outputs.has_patch == 'true' )
        uses: ./.github/actions/action-run-tests
        with:
          package-path: package-repo
          package-name: ${{ matrix.package }}
          test-type: patched
          timeout: ${{ needs.load_config.outputs.test_timeout }}
          verbose-pytest: ${{ inputs.verbose_pytest }}
          no-format-check: ${{ inputs.no_format_check }}

      # if the previous step failed, we will try to run the tests without patches
      - name: Clone package repository for tests without patches
        continue-on-error: true
        if: env.SO_FAR_OK == '1' && steps.test_with_patch.outputs.conclusion == 'failure' && needs.load_config.outputs.run_original_tests == 'true'
        uses: ./.github/actions/action-clone-package
        with:
          repository-url: ${{ steps.load_patches.outputs.original_repository_url }}
          repository-branch: ${{ steps.load_patches.outputs.original_repository_branch }}
          destination: package-repo

      - name: Setup virtual environment and install dependencies for original package tests
        if: env.SO_FAR_OK == '1' && steps.test_with_patch.outputs.conclusion == 'failure' && needs.load_config.outputs.run_original_tests == 'true'
        continue-on-error: true
        uses: ./.github/actions/action-setup-venv
        with:
          package-path: package-repo
          extras: ${{ env.EXTRAS }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run tests on original package without patches
        id: test_without_patch
        continue-on-error: true
        if: env.SO_FAR_OK == '1' && steps.test_with_patch.outputs.conclusion == 'failure' && needs.load_config.outputs.run_original_tests == 'true'
        uses: ./.github/actions/action-run-tests
        with:
          package-path: package-repo
          package-name: ${{ matrix.package }}
          test-type: original
          timeout: ${{ needs.load_config.outputs.test_timeout }}
          verbose-pytest: ${{ inputs.verbose_pytest }}
          no-format-check: ${{ inputs.no_format_check }}

      - name: Compare test results
        if: env.SO_FAR_OK == '1'
        id: compare
        continue-on-error: true
        uses: ./.github/actions/action-compare-test-results
        with:
          artifacts_dir: artifacts

      - name: Create result summary
        id: summary
        continue-on-error: true
        run: |
          if [ -z "${{ steps.check_patch.outputs.applies }}" ] ; then
            APPLIES="false"
          else
            APPLIES="${{ steps.check_patch.outputs.applies }}"
          fi

          cat > artifacts/result-summary.json << EOF
          {
            "package": "${{ matrix.package }}",
            "has_patch": ${{ steps.load_patches.outputs.has_patch }},
            "patch_applies": $APPLIES,
            "original_tests_outcome": "${{ steps.compare.outputs.original_tests_outcome }}",
            "patched_tests_outcome": "${{ steps.compare.outputs.patched_tests_outcome }}",
            "result": "${{ steps.compare.outputs.result }}",
            "result_icon": "${{ steps.compare.outputs.result_icon }}",
            "result_text": "${{ steps.compare.outputs.result_text }}",
            "patched_packages": "${{ steps.check_patch.outputs.patched_packages }}"
          }
          EOF

          cat artifacts/result-summary.json

      - name: Extract warnings from test logs
        if: always()
        run: |
          # Extract warnings from original test log if it exists
          if [ -f artifacts/test-output-original.txt ]; then
            $TOOLS_PYTHON scripts/extract_warnings.py artifacts/test-output-original.txt original artifacts/result-summary.json artifacts/warnings-original.md
          fi

          # Extract warnings from patched test log if it exists
          if [ -f artifacts/test-output-patched.txt ]; then
            $TOOLS_PYTHON scripts/extract_warnings.py artifacts/test-output-patched.txt patched artifacts/result-summary.json artifacts/warnings-patched.md
          fi

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.package }}
          path: |
            artifacts/
          retention-days: 30

      # needs to be after uploading artifacts
      # as the action downloads all actual artifacts
      - name: Push individual package report
        if: always()
        uses: ./.github/actions/action-generate-report
        with:
          report_dir: ${{ needs.create_report_directory.outputs.report_dir }}
          report_file: ${{ needs.create_report_directory.outputs.report_file }}
          report_timestamp: ${{ needs.create_report_directory.outputs.report_timestamp }}
          test_name: ${{ needs.load_config.outputs.test_name }}
          config_file: ${{ env.CONFIG_RESOLVED }}

      - name: Fail job if any tests failed
        if: always()
        run: |
          ORIGINAL_TESTS_OUTCOME=$(cat artifacts/test-status-original.txt 2>/dev/null || echo "skipped")
          PATCHED_TESTS_OUTCOME=$(cat artifacts/test-status-patched.txt 2>/dev/null|| echo "skipped")

          if [ "$PATCHED_TESTS_OUTCOME" = "failed" ] ; then
            echo "Error: Tests for patched package ${{ matrix.package }} failed"
            exit 1
          elif [ "$ORIGINAL_TESTS_OUTCOME" = "failed" ] ; then
            echo "Error: Tests for original package ${{ matrix.package }} failed"
            exit 1
          fi

  copy_previous_artifacts:
    name: Copy Previous Artifacts
    needs:
      - load_config
      - extract_tested_packages
      - create_report_directory
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    if: needs.extract_tested_packages.outputs.done_packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.extract_tested_packages.outputs.done_packages) }}

    steps:
      - name: Checkout invenio-testrig repository
        uses: actions/checkout@v4

      - name: Copy artifacts from previous report
        run: |
          PREVIOUS_REPORT="${{ needs.extract_tested_packages.outputs.previous_report }}"
          PACKAGE="${{ matrix.package }}"

          echo "Copying artifacts for $PACKAGE from $PREVIOUS_REPORT"

          # Create artifacts directory
          mkdir -p artifacts

          # Copy all files from previous report's package directory
          if [ -d "${PREVIOUS_REPORT}packages/${PACKAGE}" ]; then
            cp -r "${PREVIOUS_REPORT}packages/${PACKAGE}"/* artifacts/ 2>/dev/null || true
            echo "✓ Copied artifacts for $PACKAGE"
          else
            echo "⚠️  No previous artifacts found for $PACKAGE"
          fi

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.package }}
          path: |
            artifacts/
          retention-days: 30

      # needs to be after uploading artifacts
      # as the action downloads all actual artifacts
      - name: Push individual package report
        if: always()
        uses: ./.github/actions/action-generate-report
        with:
          report_dir: ${{ needs.create_report_directory.outputs.report_dir }}
          report_file: ${{ needs.create_report_directory.outputs.report_file }}
          report_timestamp: ${{ needs.create_report_directory.outputs.report_timestamp }}
          test_name: ${{ needs.load_config.outputs.test_name }}
          config_file: ${{ env.CONFIG_RESOLVED }}

  generate_report:
    name: Generate Summary Report
    needs:
      - create_report_directory
      - test_packages
      - copy_previous_artifacts
      - load_config
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write

    steps:
      - name: Checkout invenio-testrig repository
        uses: actions/checkout@v4

      - name: Download modified config
        uses: actions/download-artifact@v4
        with:
          name: resolved-config
          path: .

      - name: Setup Python and UV
        uses: ./.github/actions/action-install-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate and push report
        uses: ./.github/actions/action-generate-report
        with:
          report_dir: ${{ needs.create_report_directory.outputs.report_dir }}
          report_file: ${{ needs.create_report_directory.outputs.report_file }}
          report_timestamp: ${{ needs.create_report_directory.outputs.report_timestamp }}
          test_name: ${{ needs.load_config.outputs.test_name }}
          config_file: ${{ env.CONFIG_RESOLVED }}
          report_status: finished

  squash_commits:
    name: Squash Commits
    needs:
      - generate_report
      - load_config
      - create_report_directory
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - name: Checkout invenio-testrig repository
        uses: actions/checkout@v4

      - name: Squash all commits
        uses: ./.github/actions/action-squash-commits
        with:
          initial_commit: ${{ needs.load_config.outputs.initial_commit }}
          report_timestamp: ${{ needs.create_report_directory.outputs.report_timestamp }}
