name: 2. Run Verification

on:
    # the workflow can be triggered manually
    workflow_dispatch:
        inputs:
            python_version:
                description: "Python version to use"
                required: false
                type: string
                default: "3.14"
            verbose_pytest:
                description: "Run pytest with verbose output (-vv -s)"
                required: false
                type: boolean
                default: false
            check_formatting:
                description: "Check black/isort during tests"
                required: false
                type: boolean
                default: true

    # or called from another workflow from another repository
    workflow_call:
        inputs:
            testrig_repository:
                description: "Repository containing invenio-testrig (owner/repo)"
                required: false
                default: oarepo/invenio-testrig
                type: string
            testrig_branch:
                description: "Branch of invenio-testrig to use"
                required: false
                default: ng
                type: string
            python_version:
                description: "Python version to use"
                required: false
                type: string
                default: "3.14"
            verbose_pytest:
                description: "Run pytest with verbose output (-vv -s)"
                required: false
                type: boolean
                default: false
            check_formatting:
                description: "Check black/isort during tests"
                required: false
                type: boolean
                default: true
            config_file:
                description: "Path to the configuration file to use (relative to workspace root)"
                required: false
                default: config.yaml
                type: string

env:
    PYTHONUNBUFFERED: 1
    PYTHON_VERSION: ${{ inputs.python_version || '3.14' }}
    VERBOSE_PYTEST: ${{ inputs.verbose_pytest }}
    CHECK_FORMATTING: ${{ inputs.check_formatting }}

    # if the workflow is called from another workflow, we use the defaults
    TESTRIG_REPOSITORY: ${{ inputs.testrig_repository || github.repository }}
    TESTRIG_BRANCH: ${{ inputs.testrig_branch || github.ref_name }}

    # Path to the configuration file to use (relative to workspace root)
    # if workflow is called manually, use the default from this branch
    YAML_CONFIG_PATH: ${{ inputs.config_file || '.pipeline/config_test.yaml' }}
    JSON_CONFIG_PATH: ${{ inputs.config_file || 'config.json' }}
    CLONED_PACKAGES_DIR: ${{ github.workspace }}/cloned-packages
    GH_TOKEN: ${{ secrets.GH_TOKEN }}
    TEST_DIR: ${{ github.workspace }}/test_dir

permissions:
    contents: read

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            matrix_tested_packages: ${{ steps.prepare.outputs.matrix_tested_packages }}
        steps:
            - name: Checkout the testrig repository to .pipeline
              uses: actions/checkout@v4
              with:
                  repository: ${{ env.TESTRIG_REPOSITORY }}
                  ref: ${{ env.TESTRIG_BRANCH }}
                  path: .pipeline

            - name: Prepare python and tools
              uses: ./.pipeline/.github/actions/action-install-tools
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  testrig-directory: ${{ github.workspace }}/.pipeline

            - name: Prepare testrig
              id: prepare
              shell: bash
              run: |

                  echo "::group::⚙️ Preparing testrig configuration"
                  invenio-testrig init $YAML_CONFIG_PATH $JSON_CONFIG_PATH
                  invenio-testrig collect $JSON_CONFIG_PATH
                  invenio-testrig filter $JSON_CONFIG_PATH
                  invenio-testrig select-patches $JSON_CONFIG_PATH
                  echo "::endgroup::"

                  echo "::group::⚙️📊 Generating test matrix"
                  invenio-testrig matrix $JSON_CONFIG_PATH $GITHUB_OUTPUT
                  echo "::endgroup::"

            - name: Store the config file as artifact
              uses: actions/upload-artifact@v6
              with:
                  name: config-file
                  path: ${{ env.JSON_CONFIG_PATH }}

    patch:
        needs: prepare
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the testrig repository to .pipeline
              uses: actions/checkout@v4
              with:
                  repository: ${{ env.TESTRIG_REPOSITORY }}
                  ref: ${{ env.TESTRIG_BRANCH }}
                  path: .pipeline

            - name: Load config file artifact
              uses: actions/download-artifact@v7
              with:
                  name: config-file

            - name: Prepare python and tools
              uses: ./.pipeline/.github/actions/action-install-tools
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  testrig-directory: ${{ github.workspace }}/.pipeline

            - name: Clone the packages and apply patches
              id: prepare
              shell: bash
              run: |
                  echo "::group::📦 Cloning and patching packages"
                  invenio-testrig clone $JSON_CONFIG_PATH $CLONED_PACKAGES_DIR
                  echo "::endgroup::"

            - name: Store cloned packages as artifact
              uses: ./.pipeline/.github/actions/upload-artifact-tar
              with:
                  name: cloned-packages
                  path: ${{ env.CLONED_PACKAGES_DIR }}

    test:
        needs:
            - prepare
            - patch
        runs-on: ubuntu-latest
        strategy:
            matrix:
                package: ${{ fromJson(needs.prepare.outputs.matrix_tested_packages) }}
            fail-fast: false
        env:
            LOG_DIR: ${{ github.workspace }}/logs
        steps:
            - name: Checkout the testrig repository to .pipeline
              uses: actions/checkout@v4
              with:
                  repository: ${{ env.TESTRIG_REPOSITORY }}
                  ref: ${{ env.TESTRIG_BRANCH }}
                  path: .pipeline

            - name: Load cloned packages artifact
              uses: ./.pipeline/.github/actions/download-artifact-tar
              with:
                  name: cloned-packages
                  path: ${{ env.CLONED_PACKAGES_DIR }}

            - name: Load config file artifact
              uses: actions/download-artifact@v7
              with:
                  name: config-file

            - name: Prepare python and tools
              uses: ./.pipeline/.github/actions/action-install-tools
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  testrig-directory: ${{ github.workspace }}/.pipeline

            - name: Run tests for the patched version of the package
              shell: bash
              id: run-patched
              run: |
                  echo "::group::🧪 Running tests for package ${{ matrix.package }}"
                  invenio-testrig test \
                      $JSON_CONFIG_PATH \
                      $CLONED_PACKAGES_DIR \
                      ${{ matrix.package }}  \
                      $TEST_DIR \
                      --apply-patches \
                      --python $PYTHON_VERSION \
                      --log-dir $LOG_DIR \
                      || true
                  echo "::endgroup::"

                  STATUS_FILE=$LOG_DIR/patched_status.json 

                  echo "test_patch_status=$(cat $STATUS_FILE | jq -r '.status')" >> $GITHUB_OUTPUT
                  status=$(cat $STATUS_FILE | jq -r '.status')

                  if [ "$status" == "failed" ]; then
                      echo "::error::❌ Tests failed for package ${{ matrix.package }}. "
                      echo "See $LOG_DIR/patched_log.log for details."
                      exit 1
                  elif [ "$status" == "skipped" ]; then
                      echo "::warning::✅ Tests were skipped for package ${{ matrix.package }} - no patches to apply."
                  else
                      echo "::notice::✅ Tests passed for package ${{ matrix.package }}."
                  fi

            - name: Run unpatched tests for the package
              shell: bash
              id: run-unpatched
              if: ${{ steps.run-patched.outputs.test_patch_status != 'success' }}
              run: |
                  echo "::group::🧪 Running tests for the unpatched version of package ${{ matrix.package }}"
                  if [ -d "$TEST_DIR" ]; then
                      echo "Cleaning test directory $TEST_DIR"
                      rm -rf $TEST_DIR
                  fi
                  invenio-testrig test \
                      $JSON_CONFIG_PATH \
                      $CLONED_PACKAGES_DIR \
                      ${{ matrix.package }}  \
                      $TEST_DIR \
                      --python $PYTHON_VERSION \
                      --log-dir $LOG_DIR \
                      || true
                  echo "::endgroup::"

                  STATUS_FILE=$LOG_DIR/original_status.json 

                  echo "test_original_status=$(cat $STATUS_FILE | jq -r '.status')" >> $GITHUB_OUTPUT
                  status=$(cat $STATUS_FILE | jq -r '.status')

                  if [ "$status" == "failed" ]; then
                      echo "::error::❌ Tests failed for package ${{ matrix.package }}. "
                      echo "See $LOG_DIR/original_log.log for details."
                      exit 1
                  elif [ "$status" == "skipped" ]; then
                      echo "::warning::❌ Tests were skipped for package ${{ matrix.package }} - not sure why."
                      exit 1
                  else
                      echo "::notice::✅ Tests passed for package ${{ matrix.package }}."
                  fi

            - name: Prepare test results for upload
              if: always()
              shell: bash
              run: |
                  # Create package-specific directory structure
                  PACKAGE_DIR=$LOG_DIR/${{ matrix.package }}
                  mkdir -p "$PACKAGE_DIR"

                  # Move all log and status files to the package directory
                    find "$LOG_DIR" -maxdepth 1 -type f -exec mv {} "$PACKAGE_DIR/" \;

            - name: Store test results as artifact
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: test-results-${{ matrix.package }}
                  path: ${{ env.LOG_DIR }}
