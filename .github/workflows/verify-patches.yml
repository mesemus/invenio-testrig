name: 2. Run Verification

on:
    # the workflow can be triggered manually
    workflow_dispatch:
        inputs:
            python_version:
                description: "Python version to use"
                required: false
                type: string
                default: "3.14"
            verbose_pytest:
                description: "Run pytest with verbose output (-vv -s)"
                required: false
                type: boolean
                default: false
            check_formatting:
                description: "Check black/isort during tests"
                required: false
                type: boolean
                default: true

    # or called from another workflow from another repository
    workflow_call:
        inputs:
            testrig_repository:
                description: "Repository containing invenio-testrig (owner/repo)"
                required: false
                default: oarepo/invenio-testrig
                type: string
            testrig_branch:
                description: "Branch of invenio-testrig to use"
                required: false
                default: ng
                type: string
            python_version:
                description: "Python version to use"
                required: false
                type: string
                default: "3.14"
            verbose_pytest:
                description: "Run pytest with verbose output (-vv -s)"
                required: false
                type: boolean
                default: false
            check_formatting:
                description: "Check black/isort during tests"
                required: false
                type: boolean
                default: true
            config_file:
                description: "Path to the configuration file to use (relative to workspace root)"
                required: false
                default: config.yaml
                type: string

env:
    PYTHONUNBUFFERED: 1
    PYTHON_VERSION: ${{ inputs.python_version || '3.14' }}
    VERBOSE_PYTEST: ${{ inputs.verbose_pytest }}
    CHECK_FORMATTING: ${{ inputs.check_formatting }}

    # if the workflow is called from another workflow, we use the defaults
    TESTRIG_REPOSITORY: ${{ inputs.testrig_repository || github.repository }}
    TESTRIG_BRANCH: ${{ inputs.testrig_branch || github.ref_name }}

    # Path to the configuration file to use (relative to workspace root)
    # if workflow is called manually, use the default from this branch
    YAML_CONFIG_PATH: ${{ inputs.config_file || '.pipeline/config_test.yaml' }}
    WORKDIR: ${{ github.workspace }}/workdir
    GH_TOKEN: ${{ secrets.GH_TOKEN }}

permissions:
    contents: read

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            matrix_tested_packages: ${{ steps.prepare.outputs.matrix_tested_packages }}
        steps:
            - name: Checkout the testrig repository to .pipeline
              uses: actions/checkout@v4
              with:
                  repository: ${{ env.TESTRIG_REPOSITORY }}
                  ref: ${{ env.TESTRIG_BRANCH }}
                  path: .pipeline

            - name: Prepare python and tools
              uses: ./.pipeline/.github/actions/action-install-tools
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  testrig-directory: ${{ github.workspace }}/.pipeline

            - name: Prepare testrig
              id: prepare
              shell: bash
              run: |

                  echo "::group::⚙️ Preparing testrig configuration"
                  invenio-testrig init $YAML_CONFIG_PATH $WORKDIR
                  invenio-testrig collect $WORKDIR
                  invenio-testrig filter $WORKDIR
                  invenio-testrig select-patches $WORKDIR
                  echo "::endgroup::"

                  echo "::group::⚙️📊 Generating test matrix"
                  invenio-testrig matrix $WORKDIR $GITHUB_OUTPUT
                  echo "::endgroup::"

            - name: Clone the packages and apply patches
              id: clone-and-patch
              shell: bash
              run: |
                  echo "::group::📦 Cloning and patching packages"
                  invenio-testrig clone $WORKDIR
                  echo "::endgroup::"

            - name: Store workdir with cloned packages as artifact
              uses: ./.pipeline/.github/actions/upload-artifact-tar
              with:
                  name: workdir
                  path: ${{ env.WORKDIR }}

    test:
        needs:
            - prepare
        runs-on: ubuntu-latest
        strategy:
            matrix:
                package: ${{ fromJson(needs.prepare.outputs.matrix_tested_packages) }}
            fail-fast: false
        steps:
            - name: Checkout the testrig repository to .pipeline
              uses: actions/checkout@v4
              with:
                  repository: ${{ env.TESTRIG_REPOSITORY }}
                  ref: ${{ env.TESTRIG_BRANCH }}
                  path: .pipeline

            - name: Load workdir artifact
              uses: ./.pipeline/.github/actions/download-artifact-tar
              with:
                  name: workdir
                  path: ${{ env.WORKDIR }}

            - name: Prepare python and tools
              uses: ./.pipeline/.github/actions/action-install-tools
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  testrig-directory: ${{ github.workspace }}/.pipeline

            - name: Run tests for the patched version of the package
              shell: bash
              id: run-patched
              run: |
                  echo "::group::🧪 Running tests for package ${{ matrix.package }}"
                  invenio-testrig test \
                      $WORKDIR \
                      ${{ matrix.package }} \
                      --apply-patches \
                      || true
                  echo "::endgroup::"

                  STATUS_FILE=$WORKDIR/artifacts/${{ matrix.package }}/patched_status.json

                  echo "test_patch_status=$(cat $STATUS_FILE | jq -r '.status')" >> $GITHUB_OUTPUT
                  status=$(cat $STATUS_FILE | jq -r '.status')

                  if [ "$status" == "failed" ]; then
                      echo "::error::❌ Tests failed for package ${{ matrix.package }}. "
                      echo "See $WORKDIR/artifacts/${{ matrix.package }}/patched_log.log for details."
                      exit 1
                  elif [ "$status" == "skipped" ]; then
                      echo "::warning::✅ Tests were skipped for package ${{ matrix.package }} - no patches to apply."
                  else
                      echo "::notice::✅ Tests passed for package ${{ matrix.package }}."
                  fi

            - name: Run unpatched tests for the package
              shell: bash
              id: run-unpatched
              if: ${{ steps.run-patched.outputs.test_patch_status != 'success' }}
              run: |
                  echo "::group::🧪 Running tests for the unpatched version of package ${{ matrix.package }}"
                  invenio-testrig test \
                      $WORKDIR \
                      ${{ matrix.package }} \
                      || true
                  echo "::endgroup::"

                  STATUS_FILE=$WORKDIR/artifacts/${{ matrix.package }}/original_status.json

                  echo "test_original_status=$(cat $STATUS_FILE | jq -r '.status')" >> $GITHUB_OUTPUT
                  status=$(cat $STATUS_FILE | jq -r '.status')

                  if [ "$status" == "failed" ]; then
                      echo "::error::❌ Tests failed for package ${{ matrix.package }}. "
                      echo "See $WORKDIR/artifacts/${{ matrix.package }}/original_log.log for details."
                      exit 1
                  elif [ "$status" == "skipped" ]; then
                      echo "::warning::❌ Tests were skipped for package ${{ matrix.package }} - not sure why."
                      exit 1
                  else
                      echo "::notice::✅ Tests passed for package ${{ matrix.package }}."
                  fi

            - name: Store test results as artifact
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: test-results-${{ matrix.package }}
                  path: ${{ env.WORKDIR }}/artifacts/${{ matrix.package }}

    report:
        needs:
            - prepare
            - test
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the testrig repository to .pipeline
              uses: actions/checkout@v4
              with:
                  repository: ${{ env.TESTRIG_REPOSITORY }}
                  ref: ${{ env.TESTRIG_BRANCH }}
                  path: .pipeline

            - name: Load workdir artifact
              uses: ./.pipeline/.github/actions/download-artifact-tar
              with:
                  name: workdir
                  path: ${{ env.WORKDIR }}

            - name: Download all test results
              uses: actions/download-artifact@v7
              with:
                  pattern: test-results-*
                  path: ${{ env.WORKDIR }}/artifacts
                  merge-multiple: true

            - name: Prepare python and tools
              uses: ./.pipeline/.github/actions/action-install-tools
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  testrig-directory: ${{ github.workspace }}/.pipeline

            - name: Generate report
              shell: bash
              run: |
                  echo "::group::📊 Generating test report"
                  REPORT_PATH=${{ github.workspace }}/report
                  invenio-testrig report $WORKDIR $REPORT_PATH --completed
                  # copy the artifacts for the report to the report directory
                  cp -r $WORKDIR/artifacts $REPORT_PATH/
                  echo "::endgroup::"

                  echo "::notice::✅ Report generated at $REPORT_PATH/index.html"

            - name: Store report as artifact
              uses: actions/upload-artifact@v6
              with:
                  name: test-report
                  path: ${{ github.workspace }}/report
